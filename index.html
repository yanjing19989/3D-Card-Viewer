<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
    />
    <title>炫酷卡片展示 - 3D Viewer</title>
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.min.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <link rel="modulepreload" href="./app.js" />
  </head>
  <body>
    <h1 class="main-title">炫酷卡片展示 · 3D</h1>

    <!-- 左右侧栏开关 -->
    <button class="sidebar-toggle toggle-left" title="打开或关闭素材面板" aria-label="打开或关闭素材面板" aria-controls="leftSidebar" id="openLeft">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 6.5h16M4 12h16M4 17.5h10" />
      </svg>
    </button>
    <button class="sidebar-toggle toggle-right" title="打开或关闭参数面板" aria-label="打开或关闭参数面板" aria-controls="rightSidebar" id="openRight">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M10 14v6" />
        <circle cx="8" cy="17" r="2" />
        <circle cx="16" cy="7" r="2" />
      </svg>
    </button>

    <!-- 左侧栏：卡面选择与预览 -->
    <aside class="sidebar" id="leftSidebar">
      <header class="sidebar-header">
        <div class="sidebar-heading">
          <span class="sidebar-kicker">ASSETS</span>
          <div class="sidebar-title">卡面素材</div>
          <p>导入正反面图片并管理当前视图</p>
        </div>
      </header>

      <div class="controls">
        <section class="control-group">
          <div class="control-group-header">
            <h3>卡面图片</h3>
          </div>
          <div class="image-inputs">
            <div class="image-input-group">
              <div class="image-input-heading">
                <span class="face-marker">F</span>
                <label for="frontImg">正面卡面</label>
                <span class="face-role">尺寸基准</span>
              </div>
              <input type="file" id="frontImg" accept="image/*" />
              <div class="preview-item"><img id="frontPreview" alt="正面预览" /></div>
              <p class="upload-hint">支持点击选择，或拖放图片到此区域</p>
            </div>

            <div class="image-input-group">
              <div class="image-input-heading">
                <span class="face-marker">B</span>
                <label for="backImg">背面卡面</label>
                <span class="face-role">背面纹理</span>
              </div>
              <input type="file" id="backImg" accept="image/*" />
              <div class="preview-item"><img id="backPreview" alt="背面预览" /></div>
              <p class="upload-hint">支持点击选择，或拖放图片到此区域</p>
            </div>
          </div>
        </section>

        <section class="control-group">
          <div class="control-group-header">
            <h3>操作</h3>
          </div>
          <div class="btn-row">
            <button class="action-button" id="resetView">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.9 7.5A8 8 0 1 1 4 14M4 5v4h4" /></svg>
              <span>重置视角</span>
            </button>
            <button class="action-button primary-action" id="exportPng">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14" /></svg>
              <span>保存快照</span>
            </button>
            <button class="action-button" id="swapFaces">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7-3 3 3 3m-3-3h13M17 17l3-3-3-3m3 3H7" /></svg>
              <span>交换正反</span>
            </button>
          </div>
          <div class="interaction-tip">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Zm0-11v6m0-10v.01" /></svg>
            <span>左键或单指旋转，滚轮或双指缩放，右键或双指拖拽平移。</span>
          </div>
        </section>
      </div>
    </aside>

    <!-- 右侧栏：参数控制 -->
    <aside class="sidebar right" id="rightSidebar">
      <header class="sidebar-header">
        <div class="sidebar-heading">
          <span class="sidebar-kicker">INSPECTOR</span>
          <div class="sidebar-title">外观参数</div>
          <p>微调卡片结构、光影与表面质感</p>
        </div>
      </header>

      <div class="controls">
        <section class="control-group">
          <div class="control-group-header">
            <h3>卡片</h3>
          </div>

          <div class="control-item">
            <label for="thickness">厚度</label>
            <output class="value-chip" id="thicknessVal" for="thickness" data-unit="u">0.05</output>
            <input type="range" id="thickness" min="0.005" max="0.25" step="0.005" value="0.05" />
          </div>

          <div class="control-item">
            <label for="cornerRadius">圆角</label>
            <output class="value-chip" id="cornerRadiusVal" for="cornerRadius" data-unit="u">0.05</output>
            <input type="range" id="cornerRadius" min="0.00" max="0.25" step="0.005" value="0.05" />
          </div>
        </section>

        <section class="control-group">
          <div class="control-group-header">
            <h3>光效</h3>
          </div>

          <div class="control-item">
            <label for="dirIntensity">光强度</label>
            <output class="value-chip" id="dirIntensityVal" for="dirIntensity">1.5</output>
            <input type="range" id="dirIntensity" min="0" max="3" step="0.05" value="1.5" />
          </div>

          <div class="control-item">
            <label for="ambIntensity">环境光</label>
            <output class="value-chip" id="ambIntensityVal" for="ambIntensity">1</output>
            <input type="range" id="ambIntensity" min="0" max="2" step="0.05" value="1" />
          </div>

          <div class="control-item">
            <label for="azimuth">方位角</label>
            <output class="value-chip" id="azimuthVal" for="azimuth" data-unit="°">45</output>
            <input type="range" id="azimuth" min="0" max="360" step="1" value="45" />
          </div>

          <div class="control-item">
            <label for="elevation">仰角</label>
            <output class="value-chip" id="elevationVal" for="elevation" data-unit="°">45</output>
            <input type="range" id="elevation" min="5" max="85" step="1" value="45" />
          </div>
        </section>

        <section class="control-group">
          <div class="control-group-header">
            <h3>阴影</h3>
          </div>

          <div class="control-item">
            <label for="shadowOpacity">阴影不透明度</label>
            <output class="value-chip" id="shadowOpacityVal" for="shadowOpacity">0.35</output>
            <input type="range" id="shadowOpacity" min="0" max="0.9" step="0.01" value="0.35" />
          </div>

          <div class="control-item">
            <label for="shadowSoft">阴影柔和度</label>
            <output class="value-chip" id="shadowSoftVal" for="shadowSoft">2.0</output>
            <input type="range" id="shadowSoft" min="0" max="8" step="0.1" value="2" />
          </div>
        </section>

        <section class="control-group">
          <div class="control-group-header">
            <h3>材质</h3>
          </div>

          <div class="control-item">
            <label for="roughness">粗糙度</label>
            <output class="value-chip" id="roughnessVal" for="roughness">0.5</output>
            <input type="range" id="roughness" min="0" max="1" step="0.01" value="0.5" />
          </div>

          <div class="control-item">
            <label for="metalness">金属度</label>
            <output class="value-chip" id="metalnessVal" for="metalness">0.50</output>
            <input type="range" id="metalness" min="0" max="1" step="0.01" value="0.50" />
          </div>

          <div class="control-item">
            <label for="clearcoat">清漆</label>
            <output class="value-chip" id="clearcoatVal" for="clearcoat">0.35</output>
            <input type="range" id="clearcoat" min="0" max="1" step="0.01" value="0.35" />
          </div>

          <div class="control-item">
            <label for="clearcoatRoughness">清漆粗糙</label>
            <output class="value-chip" id="clearcoatRoughnessVal" for="clearcoatRoughness">0.50</output>
            <input type="range" id="clearcoatRoughness" min="0" max="1" step="0.01" value="0.5" />
          </div>
        </section>
      </div>
    </aside>

    <main class="container">
      <div class="canvas-container">
        <canvas id="glCanvas"></canvas>
      </div>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
